<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">NewsRadar logo</title>
  <desc id="desc">A modern radar icon combining a news card and radar signal.</desc>

  <defs>
    <linearGradient id="accent" x1="100" y1="80" x2="410" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <!-- Radar base -->
  <circle
    cx="256" cy="256" r="190"
    fill="#F8FAFC"
    stroke="#0F172A"
    stroke-width="18"
  />

  <!-- Radar rings -->
  <circle
    cx="256" cy="256" r="125"
    fill="none"
    stroke="#CBD5E1"
    stroke-width="10"
  />

  <circle
    cx="256" cy="256" r="62"
    fill="none"
    stroke="#CBD5E1"
    stroke-width="10"
  />

  <!-- Radar sweep -->
  <path
    d="M256 256 L384 160 A160 160 0 0 1 256 416 Z"
    fill="url(#accent)"
    opacity=".16"
  />

  <!-- News card -->
  <rect
    x="145" y="126"
    width="178"
    height="146"
    rx="20"
    fill="#FFFFFF"
    stroke="#0F172A"
    stroke-width="14"
  />

  <!-- Article thumbnail -->
  <rect
    x="165" y="147"
    width="58"
    height="44"
    rx="9"
    fill="url(#accent)"
  />

  <!-- Headline -->
  <rect x="239" y="148" width="62" height="10" rx="5" fill="#0F172A"/>
  <rect x="239" y="166" width="49" height="10" rx="5" fill="#64748B"/>

  <!-- Article lines -->
  <rect x="165" y="207" width="136" height="10" rx="5" fill="#0F172A"/>
  <rect x="165" y="227" width="112" height="10" rx="5" fill="#94A3B8"/>

  <!-- Radar sweep line -->
  <path
    d="M256 256 L382 256"
    stroke="url(#accent)"
    stroke-width="16"
    stroke-linecap="round"
  />

  <!-- Radar center -->
  <circle
    cx="256" cy="256"
    r="20"
    fill="url(#accent)"
    stroke="#FFFFFF"
    stroke-width="8"
  />

  <!-- Detection signals -->
  <circle cx="372" cy="181" r="13" fill="#2563EB"/>
  <circle cx="405" cy="151" r="9" fill="#06B6D4"/>
  <circle cx="421" cy="212" r="8" fill="#0F172A"/>
</svg>
