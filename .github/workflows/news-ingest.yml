name: NewsRadar ingestion

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: newsradar-ingestion
  cancel-in-progress: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ secrets.VERCEL_APP_URL || vars.VERCEL_APP_URL || 'https://news-radar-ten.vercel.app' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET || '1xXANU8vKtEGWqmTCbJlu4tjGn39wAB4dFKzn_wy_DY' }}
    steps:
      - name: Ingest official sources
        run: |
          TARGET="${APP_URL%/}"
          echo "Ingesting official sources from ${TARGET}..."
          curl --fail --silent --show-error --max-time 180 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${TARGET}/api/cron/ingest/official"

      - name: Ingest aggregators
        run: |
          TARGET="${APP_URL%/}"
          echo "Ingesting aggregators from ${TARGET}..."
          curl --fail --silent --show-error --max-time 180 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${TARGET}/api/cron/ingest/aggregators"

      - name: Ingest research
        run: |
          TARGET="${APP_URL%/}"
          echo "Ingesting research from ${TARGET}..."
          curl --fail --silent --show-error --max-time 180 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${TARGET}/api/cron/ingest/research"

      - name: Ingest Currents (optional)
        continue-on-error: true
        run: |
          TARGET="${APP_URL%/}"
          echo "Ingesting currents from ${TARGET}..."
          curl --fail --silent --show-error --max-time 180 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${TARGET}/api/cron/ingest/currents"
